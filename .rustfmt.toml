# Group imports into std / external / crate blocks, and format code blocks
# inside doc comments. Both are stable as of rustfmt 1.9.0 (they stabilized
# the features tracked by rustfmt#5083 and rustfmt#3348). Older stable
# toolchains warn-and-ignore these rather than enforce them.
group_imports = "StdExternalCrate"
format_code_in_doc_comments = true
